name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained single-file EXE
        run: dotnet publish TB_OBS_AutoSetup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TB-OBS-Easy-V30-win-x64
          path: publish/TB_OBS_Easy.exe
          if-no-files-found: error
          retention-days: 14
